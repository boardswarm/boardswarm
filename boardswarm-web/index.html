<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boardswarm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5/css/xterm.min.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
      }
      .app-container {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 220px;
        background: #16213e;
        padding: 1rem;
        border-right: 1px solid #0f3460;
      }
      .sidebar h2 {
        color: #e94560;
        margin-bottom: 1rem;
        font-size: 1.2rem;
      }
      .sidebar a {
        display: block;
        color: #ccc;
        text-decoration: none;
        padding: 0.5rem;
        border-radius: 4px;
        margin-bottom: 0.25rem;
      }
      .sidebar a:hover, .sidebar a.active {
        background: #0f3460;
        color: #fff;
      }
      .main-content {
        flex: 1;
        padding: 1.5rem;
      }
      .item-list {
        width: 100%;
        border-collapse: collapse;
      }
      .item-list th, .item-list td {
        padding: 0.5rem 1rem;
        text-align: left;
        border-bottom: 1px solid #333;
      }
      .item-list th {
        color: #e94560;
      }
      .btn {
        padding: 0.4rem 0.8rem;
        background: #e94560;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn:hover {
        background: #c73e54;
      }
      .terminal-container {
        width: 100%;
        height: 500px;
        background: #000;
        border-radius: 4px;
        overflow: hidden;
      }
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        flex-direction: column;
        gap: 1rem;
      }
      /* Suppress browser-native video control overlays on WebRTC streams */
      video::-webkit-media-controls,
      video::-webkit-media-controls-enclosure,
      video::-webkit-media-controls-panel {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/xterm@5/lib/xterm.min.js"></script>
  </body>
</html>
